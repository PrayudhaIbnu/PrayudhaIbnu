<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Message Received</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family: "Plus Jakarta Sans", Arial, sans-serif;
      }

      .wrapper {
        width: 100%;
        padding: 32px 12px;
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 32px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        box-shadow: 0 20px 40px rgba(6, 182, 212, 0.15);
      }

      .accent-bar {
        height: 6px;
        background: linear-gradient(to right, #22d3ee, #67e8f9);
      }

      .content {
        padding: 32px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
      }

      .icon-box {
        width: 56px;
        height: 56px;
        background: #ecfeff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.25em;
        color: rgba(8, 145, 178, 0.6);
        text-transform: uppercase;
      }

      .title {
        margin: 4px 0 0;
        font-size: 28px;
        font-weight: 800;
        color: #0f172a;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 32px;
      }

      .card {
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 16px;
      }

      .label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: #94a3b8;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .value {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.3;
      }

      .email {
        font-size: 14px;
        font-weight: 500;
        color: #0891b2;
        margin-top: 4px;
      }

      .message-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: #94a3b8;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .message-box {
        background: linear-gradient(
          to right,
          rgba(34, 211, 238, 0.15),
          transparent
        );
        border-left: 4px solid #06b6d4;
        border-radius: 20px;
        padding: 24px;
      }

      .message-text {
        font-size: 16px;
        font-weight: 500;
        color: #334155;
        line-height: 1.7;
      }

      .footer {
        background: #020617;
        padding: 20px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .footer-text {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: #94a3b8;
        text-transform: uppercase;
      }

      .divider {
        width: 48px;
        height: 1px;
        background: #334155;
      }

      .outer-footer {
        text-align: center;
        margin-top: 16px;
        font-size: 12px;
        color: #94a3b8;
        font-weight: 500;
      }

      @media (max-width: 640px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .content {
          padding: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <div class="container">
        <div class="accent-bar"></div>

        <div class="content">
          <!-- Header -->
          <div class="header">
            <div class="icon-box">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="2em"
                height="2em"
                viewBox="0 0 24 24">
                <path
                  fill="currentColor"
                  d="M13 19c0-3.31 2.69-6 6-6c1.1 0 2.12.3 3 .81V6a2 2 0 0 0-2-2H4c-1.11 0-2 .89-2 2v12a2 2 0 0 0 2 2h9.09c-.05-.33-.09-.66-.09-1M4 8V6l8 5l8-5v2l-8 5zm16 7v3h3v2h-3v3h-2v-3h-3v-2h3v-3z" />
              </svg>
            </div>
            <div>
              <div class="badge">Inbound Inquiry</div>
              <h1 class="title">New Message</h1>
            </div>
          </div>

          <!-- Info -->
          <div class="grid">
            <div class="card">
              <div class="label">Sender Details</div>
              <div class="value">{{from_name}}</div>
              <div class="email">{{from_email}}</div>
            </div>

            <div class="card">
              <div class="label">Subject Line</div>
              <div class="value">{{subject}}</div>
            </div>
          </div>

          <!-- Message -->
          <div>
            <div class="message-label">Message Content</div>
            <div class="message-box">
              <p class="message-text">{{message}}</p>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer">
          <div class="footer-text">© 2026 Portfolio</div>
          <div class="divider"></div>
        </div>
      </div>

      <div class="outer-footer">
        This is an automated notification from your contact form.
      </div>
    </div>
  </body>
</html>
